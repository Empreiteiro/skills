# Publishes presentations/ to GitHub Pages on every push to main that touches it.
# Each deck is served at https://empreiteiro.github.io/skills/<slug>/
name: Deploy presentations

on:
  push:
    branches: [main]
    paths:
      - 'presentations/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: presentations
      - id: deployment
        uses: actions/deploy-pages@v4
