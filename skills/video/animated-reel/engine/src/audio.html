<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Reel soundtrack</title></head>
<body>
<script type="module">
// The reel's soundtrack (?reel=example): the score, driven by that reel's SECTIONS/CUES.
const { renderScore } = await import('./audio/score.js');
let buf = null;
window.renderAudio = async (opts = {}) => {
  buf = await renderScore(opts);
  return { sr: buf.sampleRate, len: buf.length, ch: buf.numberOfChannels };
};
window.getChunk = (c, off, n) => {
  const a = buf.getChannelData(c).subarray(off, off + n);
  const u8 = new Uint8Array(a.buffer, a.byteOffset, a.byteLength);
  let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(s);
};
window.audioReady = true;
</script>
</body>
</html>
